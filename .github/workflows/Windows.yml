name: Windows

# Build TSC for Windows and attach the installers to the newest TSC release.
#
# ISSUE #709 - "cegui dependency not available for building Windows version" -
# is answered by what this workflow does NOT install. INSTALL.md's pacman line
# asks MSYS2 for mingw-w64-x86_64-cegui, and there is no such package: CEGUI was
# dropped from MSYS2, which is exactly what the report ran into. Nothing needs to
# replace it, because TSC has not needed a system CEGUI since 2024-10-04 - it
# compiles CEGUI itself, statically, from the cegui submodule
# (tsc/cmake/modules/ProvideCEGUI.cmake, USE_SYSTEM_CEGUI defaults to OFF), and
# applies cegui-cpp11.patch and cegui-cmake-policy.patch on the way. mruby and
# pod-parser are the same. So the dependency list below is the one TSC actually
# needs, with cegui and mruby left out on purpose.
#
# 64-BIT is the build that works. MSYS2's UCRT64 environment has SFML 3.0.2,
# which is what TSC needs since the SFML 3 port (#729).
#
# 32-BIT is attempted and is expected to fail, which is why it is
# continue-on-error rather than absent. MSYS2 ended 32-bit support in May 2024,
# and what is left of the mingw32 repository is a TOOLCHAIN without libraries:
# its database carries 247 packages against ucrt64's 3917, and while
# mingw-w64-i686-gcc (16.1.0), -cmake, -ninja and -pkg-config are all still
# there, sfml, boost, glew, glm, devil and libxml++ are all gone. That is what
# pacman reports, six times over:
#
#   error: target not found: mingw-w64-i686-sfml
#
# Do not be misled by browsing https://mirror.msys2.org/mingw/mingw32/ - it
# still LISTS mingw-w64-i686-sfml-3.0.2-1-any.pkg.tar.zst. That file is a
# leftover that is no longer in mingw32.db, so pacman cannot see it and no
# amount of retrying will install it.
#
# The job is kept because that is a fact about MSYS2 today rather than about
# TSC, and it should
# be a job whose log says so on every run rather than a platform that quietly
# disappeared from the release. If 32-bit matters more than this, the way back
# is to build the dependency chain from source for i686 (as the AppImage build
# already does for SFML) rather than to take it from a package repository.
#
# The installers are made by CPack's NSIS generator, which tsc/CMakeLists.txt
# already configures - installer icon, desktop shortcut, the lot - so this runs
# it rather than describing the packaging a second time.
#
# EACH CPU SEPARATELY, AND A COMBINED INSTALLER WHEN BOTH EXIST. NSIS can carry
# both builds in one .exe and pick at install time, which is the Windows
# equivalent of a macOS universal binary - one download for somebody who does not
# know which Windows they have. It needs both halves, so it is built by a job
# after them and is skipped, with a line saying so, when 32-bit did not build -
# which today is every time, for the MSYS2 reason above. It is written now so
# that the day a 32-bit SFML 3 exists, the combined installer appears without
# anybody having to remember this.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release to add the binaries to (empty = the version CHANGELOG names)'
        required: false
        type: string
      publish:
        description: 'Attach the binaries to the release'
        required: false
        default: true
        type: boolean
      only:
        description: 'Only build these matrix entries, as a JSON array (e.g. ["win64"]); empty = all of them'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach to (empty = newest release)'
        required: false
        type: string
      publish:
        description: 'Attach the installers to the release'
        required: false
        default: true
        type: boolean
      only:
        description: 'Only build these matrix entries, as a JSON array (e.g. ["win64"]); empty = all of them'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: tsc-windows-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: read the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/changelog-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG says TSC is at $version"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: windows-2022
    continue-on-error: ${{ matrix.expected_to_fail || false }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win64
            msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
          - name: win32
            msystem: MINGW32
            prefix: mingw-w64-i686
            expected_to_fail: true
    defaults:
      run:
        shell: msys2 {0}
    # WHICH entries this run wants, decided here because it cannot be decided
    # where it belongs. A job-level `if:` cannot see `matrix` - GitHub exposes
    # that context to runs-on, env, name, steps and a few others, but not to a
    # job's own condition - and a workflow that tries answers
    #   Unrecognized named-value: 'matrix'
    # and refuses to load at all, taking every workflow that CALLS it with it.
    # A job-level env CAN see matrix, so the answer is computed once here and
    # every step below asks for it.
    env:
      BUILD_THIS: ${{ inputs.only == '' || contains(fromJSON(inputs.only), matrix.name) }}

    steps:
      - uses: actions/checkout@v4
        if: ${{ env.BUILD_THIS == 'true' }}
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        if: ${{ env.BUILD_THIS == 'true' }}
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          # No cegui and no mruby: TSC compiles both itself (#709).
          install: >-
            git patch bison gperf
            ${{ matrix.prefix }}-toolchain
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja
            ${{ matrix.prefix }}-pkgconf
            ${{ matrix.prefix }}-ruby
            ${{ matrix.prefix }}-sfml
            ${{ matrix.prefix }}-libxml++2.6
            ${{ matrix.prefix }}-boost
            ${{ matrix.prefix }}-glew
            ${{ matrix.prefix }}-glm
            ${{ matrix.prefix }}-devil
            ${{ matrix.prefix }}-freetype
            ${{ matrix.prefix }}-expat
            ${{ matrix.prefix }}-libpng
            ${{ matrix.prefix }}-gettext
            ${{ matrix.prefix }}-nsis

      - name: Build TSC
        if: ${{ env.BUILD_THIS == 'true' }}
        run: |
          set -euo pipefail
          cd tsc
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=dist
          cmake --build build -j "$(nproc)"

      - name: Make the installer
        if: ${{ env.BUILD_THIS == 'true' }}
        run: |
          set -euo pipefail
          cd tsc/build
          cpack -G NSIS
          cpack -G 7Z

      # The names the release uses, matching the .deb and AppImage assets:
      # what it is, which version, what it runs on.
      - name: Name the files and checksum them
        if: ${{ env.BUILD_THIS == 'true' }}
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.version }}'
          mkdir -p dist
          n=0
          for f in tsc/build/*.exe tsc/build/*.7z; do
            [ -e "$f" ] || continue
            ext="${f##*.}"
            name="TSC-${version}-${{ matrix.name }}.${ext}"
            cp "$f" "dist/$name"
            ( cd dist && md5sum "$name" > "${name%.$ext}.md5sum" \
                      && sha256sum "$name" > "${name%.$ext}.sha256sum" )
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo "::error::cpack produced no installer"
            exit 1
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        if: ${{ env.BUILD_THIS == 'true' }}
        with:
          name: windows-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  # One installer carrying both CPUs. Only possible when both built.
  combined:
    name: combined 32/64-bit installer
    needs: [version, build]
    if: ${{ always() }}
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: parts

      - name: Weld them into one installer, if both are there
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.version }}'
          win64="$(ls parts/windows-win64/TSC-${version}-win64.exe 2>/dev/null | head -n1 || true)"
          win32="$(ls parts/windows-win32/TSC-${version}-win32.exe 2>/dev/null | head -n1 || true)"

          if [ -z "$win64" ] || [ -z "$win32" ]; then
            echo "::warning::A combined installer needs both a 32-bit and a 64-bit build, and $( [ -z "$win32" ] && echo 32 || echo 64 )-bit is missing. MSYS2 has had no 32-bit SFML 3 since it ended 32-bit support in May 2024, so this is expected until that changes; the per-CPU installers are published on their own."
            exit 0
          fi

          # An NSIS script that carries both and picks by RunningX64. The two
          # CPack installers are run silently into the chosen directory, which
          # keeps every shortcut, icon and uninstaller CPack already sets up
          # rather than describing all of it a second time here.
          mkdir -p combined dist
          cp "$win64" combined/tsc-win64.exe
          cp "$win32" combined/tsc-win32.exe
          cat > combined/tsc.nsi <<NSI
          !include "x64.nsh"
          Name "The Secret Chronicles of Dr. M. ${version}"
          OutFile "..\\dist\\TSC-${version}-windows.exe"
          RequestExecutionLevel admin
          SilentInstall normal
          Page instfiles
          Section
            SetOutPath "\$TEMP\\tsc-install"
            \${If} \${RunningX64}
              File "tsc-win64.exe"
              ExecWait '"\$TEMP\\tsc-install\\tsc-win64.exe" /S'
            \${Else}
              File "tsc-win32.exe"
              ExecWait '"\$TEMP\\tsc-install\\tsc-win32.exe" /S'
            \${EndIf}
            RMDir /r "\$TEMP\\tsc-install"
          SectionEnd
          NSI

          "/c/Program Files (x86)/NSIS/makensis.exe" combined/tsc.nsi

          name="TSC-${version}-windows"
          ( cd dist
            md5sum    "${name}.exe" > "${name}.md5sum"
            sha256sum "${name}.exe" > "${name}.sha256sum" )
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-combined
          path: dist/
          if-no-files-found: warn

  publish:
    name: attach to the release
    needs: [version, build, combined]
    if: ${{ always() && inputs.publish != false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: assets
          merge-multiple: true

      - name: Say what was built, and what was not
        run: |
          set -euo pipefail
          ls -l assets 2>/dev/null || true
          if ! ls assets/*.exe >/dev/null 2>&1; then
            echo "::error::No Windows installer was produced; nothing is uploaded."
            exit 1
          fi
          ls assets/*win32* >/dev/null 2>&1 || \
            echo "::warning::no 32-bit installer - MSYS2 has had no 32-bit SFML 3 since it ended 32-bit support in May 2024; see the workflow comment"

      - name: Work out which release to attach to
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          # No tag given: the version CHANGELOG names, which is what the
          # release is called.
          [ -n "$tag" ] || tag="v$(bash .github/scripts/changelog-version.sh)"
          # Create it if it is not there. A workflow pointed at a version that
          # does not exist yet should make it, not fail - that was a
          # chicken-and-egg problem on the first build of every version.
          bash .github/scripts/ensure-release.sh "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload '${{ steps.release.outputs.tag }}' assets/* --clobber
          echo "Uploaded to $(gh release view '${{ steps.release.outputs.tag }}' --json url --jq .url)"
