name: Windows

# Build TSC for Windows and attach the installers to the newest TSC release.
#
# ISSUE #709 - "cegui dependency not available for building Windows version" -
# is answered by what this workflow does NOT install. INSTALL.md's pacman line
# asks MSYS2 for mingw-w64-x86_64-cegui, and there is no such package: CEGUI was
# dropped from MSYS2, which is exactly what the report ran into. Nothing needs to
# replace it, because TSC has not needed a system CEGUI since 2024-10-04 - it
# compiles CEGUI itself, statically, from the cegui submodule
# (tsc/cmake/modules/ProvideCEGUI.cmake, USE_SYSTEM_CEGUI defaults to OFF), and
# applies cegui-cpp11.patch and cegui-cmake-policy.patch on the way. mruby and
# pod-parser are the same. So the dependency list below is the one TSC actually
# needs, with cegui and mruby left out on purpose.
#
# 64-BIT is the build that works. MSYS2's UCRT64 environment has SFML 3.0.2,
# which is what TSC needs since the SFML 3 port (#729).
#
# 32-BIT builds against a WeKan-maintained mirror. MSYS2 ended 32-bit support in
# May 2024: the mingw32 database still carries the TOOLCHAIN (gcc 16.1.0, cmake,
# ninja, pkgconf) but every i686 LIBRARY - sfml, boost, glew, glm, freetype,
# libxml++, ... - was delisted, so `pacman -S mingw-w64-i686-sfml` says
#   error: target not found: mingw-w64-i686-sfml
# even though the .pkg.tar.zst is still physically served from
# https://repo.msys2.org/mingw/mingw32/ (it is only gone from the db).
#
# So the delisted libraries are mirrored and re-served with a regenerated db, and
# the one package MSYS2 no longer builds at all - libxml++ 2.6, its current
# libxmlpp being 5.x - is rebuilt for i686. The win32 job installs the toolchain
# from the live mingw32 db and everything else from that mirror, whose pacman
# Server URL is the repo/org variable MINGW32_MIRROR. The mirror + package tooling
# lives in the wekan repo's log/ directory: mirror-mingw.sh (mirror the leftovers),
# build-mingw32-package.sh + pkgbuilds/mingw-w64-libxml++2.6 (rebuild libxml++),
# regenerate-mirror-db.sh (make it a working repo), upload-msys2-mirror-to-github.sh
# and generate-msys2-mirror-site.sh (host it on GitHub Releases + Pages).
#
# It stays continue-on-error (expected_to_fail) until MINGW32_MIRROR is set and
# the mirror is populated; then the Install-win32-libraries step succeeds, win32
# builds, and expected_to_fail can be removed.
#
# The installers are made by CPack's NSIS generator, which tsc/CMakeLists.txt
# already configures - installer icon, desktop shortcut, the lot - so this runs
# it rather than describing the packaging a second time.
#
# EACH CPU SEPARATELY, AND A COMBINED INSTALLER WHEN BOTH EXIST. NSIS can carry
# both builds in one .exe and pick at install time, which is the Windows
# equivalent of a macOS universal binary - one download for somebody who does not
# know which Windows they have. It needs both halves, so it is built by a job
# after them and is skipped, with a line saying so, when 32-bit did not build -
# which today is every time, for the MSYS2 reason above. It is written now so
# that the day a 32-bit SFML 3 exists, the combined installer appears without
# anybody having to remember this.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release to add the binaries to (empty = the version CHANGELOG names)'
        required: false
        type: string
      publish:
        description: 'Attach the binaries to the release'
        required: false
        default: true
        type: boolean
      only:
        description: 'Only these builds - win64 win32 - as win64,win32 or ["win64","win32"]; empty = all of them'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach to (empty = newest release)'
        required: false
        type: string
      publish:
        description: 'Attach the installers to the release'
        required: false
        default: true
        type: boolean
      only:
        description: 'Only these builds - win64 win32 - as win64,win32 or ["win64","win32"]; empty = all of them'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: tsc-windows-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: read the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      only: ${{ steps.read.outputs.only }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        env:
          # Through the environment, not interpolated into the script: an input
          # pasted straight into a shell line is a value that can end the quote
          # it sits in and keep going.
          IN_ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/changelog-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG says TSC is at $version"

          # WHICH matrix entries this run wants, decided HERE rather than in a
          # template expression on the build job, where `fromJSON` on a raw
          # input is evaluated while the workflow TEMPLATE is parsed: hand it
          # something that is not JSON and the run does not fail a build, it
          # fails to LOAD ("The template is not valid ... Unexpected character
          # encountered while parsing value"), killing every matrix entry
          # before a single step runs. That is what `only: v2.2.0-beta2` did to
          # AppImage.yml. matrix-only.sh accepts ["a","b"], a,b or a b, rejects
          # anything else with a message naming the valid entries, and always
          # prints valid JSON. The entries listed here are this workflow's
          # matrix - keep them in step with it.
          only="$(bash .github/scripts/matrix-only.sh "$IN_ONLY" win64 win32)"
          echo "only=$only" >> "$GITHUB_OUTPUT"
          if [ "$only" = '[]' ]; then
            echo "Building every entry of the matrix."
          else
            echo "Building only: $only"
          fi

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: windows-2022
    continue-on-error: ${{ matrix.expected_to_fail || false }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win64
            msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
            # win64 gets everything from MSYS2's own ucrt64 repo, as before.
            setup_install: >-
              git patch bison gperf
              mingw-w64-ucrt-x86_64-toolchain
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-ninja
              mingw-w64-ucrt-x86_64-pkgconf
              mingw-w64-ucrt-x86_64-ruby
              mingw-w64-ucrt-x86_64-sfml
              mingw-w64-ucrt-x86_64-libxml++2.6
              mingw-w64-ucrt-x86_64-boost
              mingw-w64-ucrt-x86_64-glew
              mingw-w64-ucrt-x86_64-glm
              mingw-w64-ucrt-x86_64-freetype
              mingw-w64-ucrt-x86_64-expat
              mingw-w64-ucrt-x86_64-libpng
              mingw-w64-ucrt-x86_64-gettext
              mingw-w64-ucrt-x86_64-nsis
          - name: win32
            msystem: MINGW32
            prefix: mingw-w64-i686
            expected_to_fail: true
            # win32 installs ONLY the toolchain here - MSYS2 delisted every i686
            # LIBRARY when it dropped 32-bit, so gcc/cmake/ninja/pkgconf are all
            # that pacman can still see in mingw32. The libraries come from the
            # WeKan mirror in the next step (see the MINGW32_MIRROR note below).
            setup_install: >-
              git patch bison gperf
              mingw-w64-i686-toolchain
              mingw-w64-i686-cmake
              mingw-w64-i686-ninja
              mingw-w64-i686-pkgconf
    defaults:
      run:
        shell: msys2 {0}
    # WHICH entries this run wants, decided here because it cannot be decided
    # where it belongs. A job-level `if:` cannot see `matrix` - GitHub exposes
    # that context to runs-on, env, name, steps and a few others, but not to a
    # job's own condition - and a workflow that tries answers
    #   Unrecognized named-value: 'matrix'
    # and refuses to load at all, taking every workflow that CALLS it with it.
    # A job-level env CAN see matrix, so the answer is computed once here and
    # every step below asks for it.
    env:
      BUILD_THIS: ${{ needs.version.outputs.only == '[]' || contains(fromJSON(needs.version.outputs.only), matrix.name) }}

    steps:
      - uses: actions/checkout@v4
        if: ${{ env.BUILD_THIS == 'true' }}
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        if: ${{ env.BUILD_THIS == 'true' }}
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          # No cegui and no mruby: TSC compiles both itself (#709). No devil: TSC
          # switched CEGUI to its built-in STB image codec, so DevIL is gone. The
          # per-arch package set is matrix.setup_install (win64: everything from
          # ucrt64; win32: only the toolchain - its libraries come next).
          install: ${{ matrix.setup_install }}

      # win32 only: MSYS2 dropped 32-bit, so its i686 LIBRARY packages (sfml,
      # boost, glew, freetype, ..., and libxml++2.6) are delisted from mingw32.db
      # and `pacman -S` them says "target not found". They still exist, and are
      # served - together with a rebuilt mingw-w64-i686-libxml++2.6 (MSYS2's
      # current libxmlpp is 5.x; TSC needs the 2.6 API) - by the WeKan-maintained
      # mirror, whose pacman Server URL is the repo/org variable MINGW32_MIRROR.
      # See the mirror + package tooling in the wekan repo's log/ scripts:
      # mirror-mingw.sh, build-mingw32-package.sh, regenerate-mirror-db.sh,
      # upload-msys2-mirror-to-github.sh. Until MINGW32_MIRROR is set this step
      # fails with that message - which is why win32 stays expected_to_fail.
      - name: Install win32 libraries from the WeKan mirror
        if: ${{ env.BUILD_THIS == 'true' && matrix.msystem == 'MINGW32' }}
        run: |
          set -euo pipefail
          MIRROR='${{ vars.MINGW32_MIRROR }}'
          if [ -z "$MIRROR" ]; then
            echo "::error::win32 needs the MINGW32_MIRROR repository (or organization) variable set to your mirror's pacman Server URL, e.g. https://github.com/wekan/msys2-mirror/releases/download/mingw-mingw32 . MSYS2 dropped 32-bit; the i686 libraries and the rebuilt libxml++2.6 come from that mirror. See the log/ mirror scripts."
            exit 1
          fi
          printf '\n[mingw32-mirror]\nSigLevel = Optional TrustAll\nServer = %s\n' "$MIRROR" >> /etc/pacman.conf
          pacman -Sy --noconfirm
          # The same libraries win64 got from ucrt64, taken from the mirror. The
          # toolchain (installed above) stays from the live mingw32 db.
          pacman -S --needed --noconfirm \
            mingw-w64-i686-ruby \
            mingw-w64-i686-sfml \
            mingw-w64-i686-libxml++2.6 \
            mingw-w64-i686-boost \
            mingw-w64-i686-glew \
            mingw-w64-i686-glm \
            mingw-w64-i686-freetype \
            mingw-w64-i686-expat \
            mingw-w64-i686-libpng \
            mingw-w64-i686-gettext \
            mingw-w64-i686-nsis

      - name: Build TSC
        if: ${{ env.BUILD_THIS == 'true' }}
        run: |
          set -euo pipefail
          cd tsc
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=dist
          cmake --build build -j "$(nproc)"

      - name: Make the installer
        if: ${{ env.BUILD_THIS == 'true' }}
        run: |
          set -euo pipefail
          cd tsc/build
          cpack -G NSIS
          cpack -G 7Z

      # The names the release uses, matching the .deb and AppImage assets:
      # what it is, which version, what it runs on.
      - name: Name the files and checksum them
        if: ${{ env.BUILD_THIS == 'true' }}
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.version }}'
          mkdir -p dist
          n=0
          for f in tsc/build/*.exe tsc/build/*.7z; do
            [ -e "$f" ] || continue
            ext="${f##*.}"
            name="TSC-${version}-${{ matrix.name }}.${ext}"
            cp "$f" "dist/$name"
            # The checksum files keep the full name including .exe/.7z, so the
            # installer and the archive of one build get a pair each instead of
            # both writing TSC-<version>-<name>.md5sum and one clobbering the other.
            ( cd dist && md5sum "$name" > "${name}.md5sum" \
                      && sha256sum "$name" > "${name}.sha256sum" )
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo "::error::cpack produced no installer"
            exit 1
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        if: ${{ env.BUILD_THIS == 'true' }}
        with:
          name: windows-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  # One installer carrying both CPUs. Only possible when both built.
  combined:
    name: combined 32/64-bit installer
    needs: [version, build]
    if: ${{ always() }}
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: parts

      - name: Weld them into one installer, if both are there
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.version }}'
          win64="$(ls parts/windows-win64/TSC-${version}-win64.exe 2>/dev/null | head -n1 || true)"
          win32="$(ls parts/windows-win32/TSC-${version}-win32.exe 2>/dev/null | head -n1 || true)"

          if [ -z "$win64" ] || [ -z "$win32" ]; then
            echo "::warning::A combined installer needs both a 32-bit and a 64-bit build, and $( [ -z "$win32" ] && echo 32 || echo 64 )-bit is missing. MSYS2 has had no 32-bit SFML 3 since it ended 32-bit support in May 2024, so this is expected until that changes; the per-CPU installers are published on their own."
            exit 0
          fi

          # An NSIS script that carries both and picks by RunningX64. The two
          # CPack installers are run silently into the chosen directory, which
          # keeps every shortcut, icon and uninstaller CPack already sets up
          # rather than describing all of it a second time here.
          mkdir -p combined dist
          cp "$win64" combined/tsc-win64.exe
          cp "$win32" combined/tsc-win32.exe
          cat > combined/tsc.nsi <<NSI
          !include "x64.nsh"
          Name "The Secret Chronicles of Dr. M. ${version}"
          OutFile "..\\dist\\TSC-${version}-windows.exe"
          RequestExecutionLevel admin
          SilentInstall normal
          Page instfiles
          Section
            SetOutPath "\$TEMP\\tsc-install"
            \${If} \${RunningX64}
              File "tsc-win64.exe"
              ExecWait '"\$TEMP\\tsc-install\\tsc-win64.exe" /S'
            \${Else}
              File "tsc-win32.exe"
              ExecWait '"\$TEMP\\tsc-install\\tsc-win32.exe" /S'
            \${EndIf}
            RMDir /r "\$TEMP\\tsc-install"
          SectionEnd
          NSI

          "/c/Program Files (x86)/NSIS/makensis.exe" combined/tsc.nsi

          name="TSC-${version}-windows"
          ( cd dist
            md5sum    "${name}.exe" > "${name}.exe.md5sum"
            sha256sum "${name}.exe" > "${name}.exe.sha256sum" )
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-combined
          path: dist/
          if-no-files-found: warn

  publish:
    name: attach to the release
    needs: [version, build, combined]
    if: ${{ always() && inputs.publish != false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: assets
          merge-multiple: true

      - name: Say what was built, and what was not
        run: |
          set -euo pipefail
          ls -l assets 2>/dev/null || true
          if ! ls assets/*.exe >/dev/null 2>&1; then
            echo "::error::No Windows installer was produced; nothing is uploaded."
            exit 1
          fi
          ls assets/*win32* >/dev/null 2>&1 || \
            echo "::warning::no 32-bit installer - MSYS2 has had no 32-bit SFML 3 since it ended 32-bit support in May 2024; see the workflow comment"

      - name: Work out which release to attach to
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          # No tag given: the version CHANGELOG names, which is what the
          # release is called.
          [ -n "$tag" ] || tag="v$(bash .github/scripts/changelog-version.sh)"
          # Create it if it is not there. A workflow pointed at a version that
          # does not exist yet should make it, not fail - that was a
          # chicken-and-egg problem on the first build of every version.
          bash .github/scripts/ensure-release.sh "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload '${{ steps.release.outputs.tag }}' assets/* --clobber
          echo "Uploaded to $(gh release view '${{ steps.release.outputs.tag }}' --json url --jq .url)"
