name: AppImage

# Build an AppImage of TSC for every CPU architecture it can be built for, and
# attach them to the release of the version CHANGELOG names.
#
# An AppImage is one executable file that runs on any Linux distribution with no
# installation and no package manager, which is the thing the .deb packages from
# Deb.yml cannot be. A .deb is built against one distribution's libraries and
# only installs on that distribution; since the SFML 3 port (#729) TSC needs
# SFML 3, which only Ubuntu 26.04 and Debian 14 ship, so on anything older there
# can be no TSC package at all. The AppImage carries its own SFML and runs there
# anyway.
#
# THE VERSION COMES FROM CHANGELOG. `* Version 2.2.0-beta2.` in the topmost
# entry that has a number is what names the tag (v2.2.0-beta2) and every file
# uploaded - see .github/scripts/changelog-version.sh. CHANGELOG is already the
# file the .deb carries as DEBIAN/CHANGELOG, so this adds no second place where
# a version is written down and could disagree.
#
# WHY IT IS BUILT ON BOOKWORM. glibc is backward compatible but not forward
# compatible: a binary built against glibc 2.41 will not start on a system with
# 2.36, but one built against 2.36 runs on both. So an AppImage is built on the
# OLDEST distribution it should run on, and Debian bookworm is that choice here.
# Bookworm ships SFML 2, so SFML 3 is compiled from source into the container
# and bundled - which is what an AppImage is for.
#
# WHICH ARCHITECTURES. AppImage needs a runtime binary for the CPU it runs on,
# and those exist for x86_64, aarch64 and armhf only. There is no AppImage for
# s390x, ppc64el or riscv64 to build - those architectures get a .deb from
# Deb.yml instead. armhf has no runner of its own and is emulated, so it is
# marked continue-on-error: a slow emulated build must not hold up the two that
# run on real hardware.
#
# armhf FAILS UNDER EMULATION, and not for a reason this workflow can fix.
# linuxdeploy ships its armhf build as a static-PIE executable, and qemu-user -
# which is what runs an armhf binary on an x86_64 runner - cannot load those:
# the job gets "cannot execute binary file: Exec format error" AFTER building
# TSC successfully. It is continue-on-error, so it reports that and the two
# native architectures still publish. Building it for real needs an armhf
# runner, not a change here.
#
# ONE PER CPU, AND THERE IS NO MULTI-CPU ONE. An AppImage begins with a runtime
# binary for one architecture - that is what the kernel executes when the file is
# run - so a single AppImage holding several CPUs is not a thing the format can
# express, the way a macOS universal binary or a Flatpak repository can. The
# multi-CPU answers TSC does have are the Flatpak repository from Flatpak.yml,
# which serves every architecture from one remote, and the apt repository from
# Repos.yml, which does the same for the .deb packages.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release to add the binaries to (empty = the version CHANGELOG names)'
        required: false
        type: string
      publish:
        description: 'Attach the binaries to the release'
        required: false
        default: true
        type: boolean
      only:
        description: 'Only build these matrix entries, as a JSON array (e.g. ["armhf","x86_64"]); empty = all of them'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach the AppImages to the release'
        required: false
        default: true
        type: boolean
      only:
        description: 'Only build these matrix entries, as a JSON array (e.g. ["armhf","x86_64"]); empty = all of them'
        required: false
        default: ''
        type: string
      draft:
        description: 'Create the release as a draft if it does not exist yet'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: tsc-appimage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: read the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from CHANGELOG
        id: read
        run: |
          set -euo pipefail
          # The version names the FILES; the tag names the RELEASE. They are the
          # same thing unless a caller asked for a particular release - which
          # release-all.yml does, so every workflow in one run publishes to the
          # same place even if CHANGELOG has moved on since.
          version="$(bash .github/scripts/changelog-version.sh)"
          tag='${{ inputs.tag }}'
          [ -n "$tag" ] || tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG says TSC is at $version; publishing to $tag"

  build:
    name: AppImage ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runs_on }}
    continue-on-error: ${{ matrix.emulated || false }}
    timeout-minutes: ${{ matrix.emulated && 360 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            docker_platform: linux/amd64
            runs_on: ubuntu-24.04
          - arch: aarch64
            docker_platform: linux/arm64
            runs_on: ubuntu-24.04-arm
          - arch: armhf
            docker_platform: linux/arm/v7
            runs_on: ubuntu-24.04
            emulated: true
    # WHICH entries this run wants, decided here because it cannot be decided
    # where it belongs. A job-level `if:` cannot see `matrix` - GitHub exposes
    # that context to runs-on, env, name, steps and a few others, but not to a
    # job's own condition - and a workflow that tries answers
    #   Unrecognized named-value: 'matrix'
    # and refuses to load at all, taking every workflow that CALLS it with it.
    # A job-level env CAN see matrix, so the answer is computed once here and
    # every step below asks for it.
    env:
      BUILD_THIS: ${{ inputs.only == '' || contains(fromJSON(inputs.only), matrix.arch) }}

    steps:
      - uses: actions/checkout@v4
        if: ${{ env.BUILD_THIS == 'true' }}
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Register the emulator
        if: ${{ env.BUILD_THIS == 'true' && (matrix.emulated) }}
        uses: docker/setup-qemu-action@v3

      - name: Build TSC and pack the AppImage
        if: ${{ env.BUILD_THIS == 'true' }}
        run: |
          set -euo pipefail
          # TSC_SFML=source: bookworm ships SFML 2, and an AppImage bundles its
          # libraries, so SFML 3 is compiled into the container.
          docker run --rm --platform ${{ matrix.docker_platform }} \
            -v "$PWD":/src -w /src \
            -e TSC_VERSION='${{ needs.version.outputs.version }}' \
            -e TSC_APPIMAGE_ARCH='${{ matrix.arch }}' \
            -e TSC_SFML=source \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:bookworm \
            bash -c '
              set -euo pipefail
              bash .github/scripts/install-build-dependencies.sh \
                file wget xz-utils zsync desktop-file-utils
              bash .github/scripts/build-tsc.sh
              bash .github/scripts/build-appimage.sh
            '

      - uses: actions/upload-artifact@v4
        if: ${{ env.BUILD_THIS == 'true' }}
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  publish:
    name: attach to the release
    needs: [version, build]
    if: ${{ always() && inputs.publish != false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: appimage-*
          path: assets
          merge-multiple: true

      - name: Say what was built, and what was not
        run: |
          set -euo pipefail
          built=""
          for f in assets/*.AppImage; do
            [ -e "$f" ] || continue
            built="$built $(basename "$f")"
          done
          if [ -z "$built" ]; then
            echo "::error::No architecture produced an AppImage - every build" \
                 "job failed. Their logs say why; nothing is uploaded."
            exit 1
          fi
          echo "AppImages built:"
          for b in $built; do echo "  $b"; done
          for want in x86_64 aarch64 armhf; do
            case "$built" in
              *"-$want.AppImage"*) ;;
              *) echo "::warning::no AppImage for $want - see that build job's log" ;;
            esac
          done

      # The release named by CHANGELOG. If it is not there yet this creates it,
      # pinned to the commit that was built rather than to whatever the branch
      # points at by the time anyone looks.
      # The release these AppImages go to. Created if it is not there yet, with
      # the CHANGELOG entry for its version as the notes - see
      # .github/scripts/ensure-release.sh, which every workflow here shares.
      - name: Make sure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .github/scripts/ensure-release.sh '${{ needs.version.outputs.tag }}' \
            ${{ inputs.draft && '--draft' || '' }}

      - name: Upload them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload '${{ needs.version.outputs.tag }}' \
            assets/* --clobber
          echo "Uploaded to $(gh release view '${{ needs.version.outputs.tag }}' --json url --jq .url)"
