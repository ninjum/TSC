name: Mac

# Build TSC for macOS and attach the disk images to the newest TSC release.
#
# ISSUE #691 asked for a Macintosh version. It was ported by hand in 2020 and
# the result was a zip on a file-sharing site, which is the thing this replaces:
# a build anyone can re-run from a commit, signed for nothing but at least
# reproducible, attached to the release beside the Linux and Windows packages.
# The experimental macOS support that came out of that issue is in the tree
# already (CMakeLists.txt handles APPLE), so this is packaging, not porting.
#
# WHICH macOS VERSIONS. GitHub's runners are the constraint and they are also
# the only macOS this can be built on. The labels moved under this workflow:
#
#   macos-15        arm64   Apple silicon
#   macos-26        arm64   Apple silicon
#   macos-15-intel  x86_64  Intel
#
# macos-13 is GONE - actions/runner-images no longer lists it at all, and it was
# the label this used for Intel. macos-14 is listed as DEPRECATED. Intel did not
# disappear with them: `macos-15-intel` is the label now (`macos-15-large` is
# the same machine under its older name), and `macos-15` on its own is arm64 -
# the run that led to this shows it, "Image: macos-15-arm64" with Homebrew at
# /opt/homebrew.
#
# So the Intel build, and with it the universal image, is still possible; it
# just needed the new label. It is continue-on-error like the rest, so if that
# label turns out to be unavailable here the arm64 images still publish and the
# universal job says why it made nothing.
#
# CMAKE_OSX_DEPLOYMENT_TARGET is set two versions below the runner, which is
# what makes the result run on older macOS than it was built on - the same
# reason the AppImage is built on Debian bookworm. Homebrew's own bottles are
# built for the runner's OS, so going further back than that would mean
# building every dependency from source.
#
# EVERY CPU SEPARATELY, AND THE UNIVERSAL IMAGE AS WELL. Each macOS version and
# CPU gets its own disk image, and the two CPUs are also welded into one
# universal image that runs on both. Both are worth having and they answer
# different questions: the universal one is the download for somebody who does
# not know or care which Mac they have, and the per-CPU ones are half the size
# and are what you want when you do know - and are the only thing left if one
# architecture fails to build.
#
# The universal image cannot be made in one job: CMAKE_OSX_ARCHITECTURES=
# "x86_64;arm64" needs every dependency to be universal too, and Homebrew's are
# not - each is built for the machine it was installed on. So the per-CPU builds
# come first and `lipo` welds them together afterwards, which is what lipo is
# for. If one architecture fails there is nothing to weld, and the per-CPU images
# that did build are published on their own.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release to add the binaries to (empty = the version CHANGELOG names)'
        required: false
        type: string
      publish:
        description: 'Attach the binaries to the release'
        required: false
        default: true
        type: boolean
      only:
        description: 'Only build these matrix entries, as a JSON array (e.g. ["15-arm64","26-arm64"]); empty = all of them'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach to (empty = newest release)'
        required: false
        type: string
      publish:
        description: 'Attach the disk images to the release'
        required: false
        default: true
        type: boolean
      only:
        description: 'Only build these matrix entries, as a JSON array (e.g. ["15-arm64","26-arm64"]); empty = all of them'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: tsc-mac-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: read the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/changelog-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG says TSC is at $version"

  build:
    name: macOS ${{ matrix.macos }} ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runs_on }}
    continue-on-error: true
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: macos-15
            macos: '15'
            arch: arm64
            deployment_target: '13.0'
          - runs_on: macos-26
            macos: '26'
            arch: arm64
            deployment_target: '14.0'
          - runs_on: macos-15-intel
            macos: '15'
            arch: x86_64
            deployment_target: '13.0'
    # WHICH entries this run wants, decided here because it cannot be decided
    # where it belongs. A job-level `if:` cannot see `matrix` - GitHub exposes
    # that context to runs-on, env, name, steps and a few others, but not to a
    # job's own condition - and a workflow that tries answers
    #   Unrecognized named-value: 'matrix'
    # and refuses to load at all, taking every workflow that CALLS it with it.
    # A job-level env CAN see matrix, so the answer is computed once here and
    # every step below asks for it.
    env:
      BUILD_THIS: ${{ inputs.only == '' || contains(fromJSON(inputs.only), format('{0}-{1}', matrix.macos, matrix.arch)) }}

    steps:
      - uses: actions/checkout@v4
        if: ${{ env.BUILD_THIS == 'true' }}
        with:
          submodules: recursive
          fetch-depth: 0

      # No cegui and no mruby: TSC compiles both itself from its submodules.
      - name: Install the dependencies
        if: ${{ env.BUILD_THIS == 'true' }}
        run: |
          set -euo pipefail
          brew update
          brew install cmake ninja pkg-config bison gperf \
            sfml libxml++ boost glew glm devil freetype expat libpng gettext
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Build TSC
        if: ${{ env.BUILD_THIS == 'true' }}
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: |
          set -euo pipefail
          cd tsc
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES='${{ matrix.arch }}' \
            -DCMAKE_OSX_DEPLOYMENT_TARGET='${{ matrix.deployment_target }}' \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build build -j "$(sysctl -n hw.ncpu)"
          cmake --install build --prefix "$PWD/stage/usr"

      # A .app is a directory with a fixed shape; TSC installs a Unix tree, so
      # the tree goes into Resources and the binary into MacOS, with a wrapper
      # that points TSC at its data.
      - name: Make TSC.app and its disk image
        if: ${{ env.BUILD_THIS == 'true' }}
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.version }}'
          app="TSC.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -a tsc/stage/usr/. "$app/Contents/Resources/"
          cp "$app/Contents/Resources/bin/tsc" "$app/Contents/MacOS/tsc-bin"

          cat > "$app/Contents/MacOS/tsc" <<'SH'
          #!/bin/bash
          here="$(cd "$(dirname "$0")" && pwd)"
          res="$here/../Resources"
          export TSC_DATA_DIR="$res/share/tsc"
          exec "$here/tsc-bin" "$@"
          SH
          chmod +x "$app/Contents/MacOS/tsc"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>TSC</string>
            <key>CFBundleDisplayName</key><string>The Secret Chronicles of Dr. M.</string>
            <key>CFBundleIdentifier</key><string>org.secretchronicles.TSC</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleExecutable</key><string>tsc</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>${{ matrix.deployment_target }}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          ls -l "$app/Contents/MacOS"

          # This CPU's own disk image, published beside the universal one.
          mkdir -p dist
          name="TSC-${version}-macos${{ matrix.macos }}-${{ matrix.arch }}"
          hdiutil create -volname "TSC ${version}" -srcfolder "$app" \
            -ov -format UDZO "dist/${name}.dmg"
          ( cd dist
            md5sum "${name}.dmg" > "${name}.md5sum"
            shasum -a 256 "${name}.dmg" > "${name}.sha256sum" )
          ls -l dist

          # Tar the bundle for the universal job. NOT the directory straight to
          # upload-artifact: an artifact is a zip, and a zip does not carry the
          # executable bit - the .app would arrive with its wrapper script not
          # executable and would not start.
          tar czf "TSC-app-${{ matrix.arch }}.tar.gz" "$app"

      - uses: actions/upload-artifact@v4
        if: ${{ env.BUILD_THIS == 'true' }}
        with:
          name: mac-${{ matrix.macos }}-${{ matrix.arch }}
          path: |
            dist/
            TSC-app-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # One file that runs on both CPUs, welded from the two per-CPU builds.
  universal:
    name: universal (arm64 + x86_64)
    needs: [version, build]
    if: ${{ always() }}
    runs-on: macos-14
    # Best effort: it needs BOTH CPUs, and the per-CPU images are published
    # whether or not the weld happens.
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-*
          path: parts

      - name: lipo the two builds together
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.version }}'
          mkdir -p unpacked/arm64 unpacked/x86_64
          for t in parts/mac-*-arm64/TSC-app-arm64.tar.gz; do
            [ -e "$t" ] && tar xzf "$t" -C unpacked/arm64 && break
          done
          for t in parts/mac-*-x86_64/TSC-app-x86_64.tar.gz; do
            [ -e "$t" ] && tar xzf "$t" -C unpacked/x86_64 && break
          done
          arm="$(ls -d unpacked/arm64/TSC.app 2>/dev/null || true)"
          intel="$(ls -d unpacked/x86_64/TSC.app 2>/dev/null || true)"
          if [ -z "$arm" ] || [ -z "$intel" ]; then
            echo "::warning::A universal disk image needs both an arm64 and an" \
                 "x86_64 build, and one of them is missing - see the build jobs'" \
                 "logs. If the x86_64 one is the one missing, check that the" \
                 "macos-15-intel label is available here: macos-13, the label" \
                 "this used to use for Intel, has been retired. The arm64 disk" \
                 "images are published on their own."
            exit 0
          fi

          app="TSC.app"
          rm -rf "$app"
          cp -a "$arm" "$app"
          # Every Mach-O in the bundle has to be fat, not just the main binary.
          ( cd "$intel" && find . -type f -print ) | while read -r rel; do
            a="$arm/$rel"; i="$intel/$rel"; o="$app/$rel"
            if file "$a" 2>/dev/null | grep -q 'Mach-O' && \
               file "$i" 2>/dev/null | grep -q 'Mach-O'; then
              lipo -create "$a" "$i" -output "$o" 2>/dev/null || cp "$a" "$o"
            fi
          done

          mkdir -p dist
          name="TSC-${version}-macos-universal"
          hdiutil create -volname "TSC ${version}" -srcfolder "$app" \
            -ov -format UDZO "dist/${name}.dmg"
          ( cd dist && md5sum "${name}.dmg" > "${name}.md5sum" \
                    && shasum -a 256 "${name}.dmg" > "${name}.sha256sum" )
          lipo -info "$app/Contents/MacOS/tsc-bin" || true
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: mac-universal
          path: dist/
          if-no-files-found: warn

  publish:
    name: attach to the release
    needs: [version, build, universal]
    if: ${{ always() && inputs.publish != false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: mac-*
          path: parts

      - name: Collect the disk images
        run: |
          set -euo pipefail
          # `parts` does not exist when every build job failed: download-artifact
          # then has nothing to download and creates no directory, and `find` on
          # a directory that is not there exits non-zero - which under `set -e`
          # ended this step with a bare
          #     find: 'parts': No such file or directory
          # BEFORE it could reach the message below that says what actually
          # happened. Creating it empty costs nothing and lets the diagnostic
          # this step already carries do its job.
          mkdir -p assets parts
          find parts -name '*.dmg' -o -name '*.md5sum' -o -name '*.sha256sum' \
            | while read -r f; do cp "$f" assets/; done
          ls -l assets 2>/dev/null || true
          if ! ls assets/*.dmg >/dev/null 2>&1; then
            echo "::error::No macOS disk image was produced at all; nothing is uploaded."
            exit 1
          fi
          # The closing quote of this warning was missing, so bash - which parses
          # a script one command at a time - ran everything above and then hit
          # EOF inside an unterminated string: "unexpected EOF while looking for
          # matching `\"'". That failed the publish job on a GOOD run, after the
          # disk images had been collected and with nothing else wrong.
          ls assets/*universal* >/dev/null 2>&1 || \
            echo "::warning::no universal disk image - it needs both an arm64 and an x86_64 build; the per-CPU ones are published on their own."

      - name: Work out which release to attach to
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          # No tag given: the version CHANGELOG names, which is what the
          # release is called.
          [ -n "$tag" ] || tag="v$(bash .github/scripts/changelog-version.sh)"
          # Create it if it is not there. A workflow pointed at a version that
          # does not exist yet should make it, not fail - that was a
          # chicken-and-egg problem on the first build of every version.
          bash .github/scripts/ensure-release.sh "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload '${{ steps.release.outputs.tag }}' assets/* --clobber
          echo "Uploaded to $(gh release view '${{ steps.release.outputs.tag }}' --json url --jq .url)"
